<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません — Highlight Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07080C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='2' y='11' width='3' height='6' rx='1' fill='%235A6373'/%3E%3Crect x='7' y='6' width='3' height='16' rx='1' fill='%238891A0'/%3E%3Crect x='12' y='9' width='3' height='10' rx='1' fill='%23E8B84B'/%3E%3Crect x='17' y='4' width='3' height='20' rx='1' fill='%238891A0'/%3E%3Crect x='22' y='12' width='2' height='4' rx='1' fill='%235A6373'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
<link rel="shortcut icon" href="./favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="./site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Highlight Studio">
<meta property="og:locale" content="ja_JP">
<meta property="og:locale:alternate" content="en_US">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080C;--surface:#0E1119;--surface2:#161A24;
    --line:rgba(255,255,255,.08);--line-soft:rgba(255,255,255,.05);
    --text:#EDEFF2;--text-dim:#8891A0;--text-faint:#7E88A0;
    --accent:#E8B84B;--accent-hi:#F3CA6C;--accent-soft:#3A331F;--accent-line:#5C4E28;
    --sans:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --ease:cubic-bezier(.25,.8,.4,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    color-scheme:dark;background:var(--bg);color:var(--text);font-family:var(--sans);
    line-height:1.65;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(232,184,75,0.06), transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 10%, rgba(79,209,197,0.04), transparent 60%);
    pointer-events:none;
  }
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

  header{
    display:flex;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line-soft);
    position:relative;z-index:1;
  }
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand-mark{width:26px;height:26px;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(232,184,75,.25));}
  .brand-name{font-size:1.02rem;font-weight:700;letter-spacing:0.01em;color:var(--text);}
  .brand-name b{color:var(--accent);}

  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 24px;position:relative;z-index:1;
  }
  .code{
    font-family:var(--mono);font-size:0.82rem;letter-spacing:.08em;color:var(--accent);
    border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:20px;
    padding:5px 14px;margin-bottom:22px;
  }
  h1{font-size:1.7rem;font-weight:800;margin:0 0 12px;letter-spacing:-.01em;}
  p{color:var(--text-dim);font-size:0.92rem;max-width:38ch;margin:0 0 30px;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{
    font-family:var(--sans);font-size:0.88rem;font-weight:600;border:none;border-radius:8px;
    padding:11px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    transition:transform .12s var(--ease);
  }
  .btn-primary{background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:#1A1400;}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface2);opacity:.85;}
  .lang-toggle{
    margin-left:auto;background:none;border:1px solid var(--line);color:var(--text-dim);
    font-family:var(--sans);font-size:0.8rem;border-radius:6px;padding:6px 12px;cursor:pointer;
  }
  .lang-toggle:hover{color:var(--text);border-color:var(--line-strong,var(--line));}
</style>
</head>
<body>

<header>
  <a class="brand" href="./highlight-studio-01-landing.html">
    <svg class="brand-mark" viewBox="0 0 26 26" fill="none">
      <rect x="2" y="11" width="3" height="6" rx="1" fill="#5A6373"/>
      <rect x="7" y="6" width="3" height="16" rx="1" fill="#8891A0"/>
      <rect x="12" y="9" width="3" height="10" rx="1" fill="var(--accent)"/>
      <rect x="17" y="4" width="3" height="20" rx="1" fill="#8891A0"/>
      <rect x="22" y="12" width="2" height="4" rx="1" fill="#5A6373"/>
    </svg>
    <div class="brand-name">Highlight <b>Studio</b></div>
  </a>
  <button type="button" class="lang-toggle" data-i18n-lang-toggle>English</button>
</header>

<main>
  <div class="code">404 NOT FOUND</div>
  <h1 data-i18n="notfound.title">ページが見つかりませんでした</h1>
  <p data-i18n="notfound.desc">お探しのページは移動または削除された可能性があります。URLをご確認いただくか、トップページからやり直してください。</p>
  <div class="actions">
    <a class="btn btn-primary" href="./highlight-studio-01-landing.html" data-i18n="notfound.home">トップページへ戻る</a>
    <a class="btn btn-ghost" href="./highlight-studio-10-contact.html" data-i18n="notfound.contact">お問い合わせ</a>
  </div>
</main>

<script src="./i18n-common.js"></script>
<script>
window.HS_I18N_DICT = {
  "notfound.title": { ja: "ページが見つかりませんでした", en: "Page not found" },
  "notfound.desc": { ja: "お探しのページは移動または削除された可能性があります。URLをご確認いただくか、トップページからやり直してください。", en: "The page you're looking for may have been moved or removed. Please check the URL or start again from the homepage." },
  "notfound.home": { ja: "トップページへ戻る", en: "Back to homepage" },
  "notfound.contact": { ja: "お問い合わせ", en: "Contact us" }
};
</script>
<script src="./i18n.js"></script>
<script>
  // ロゴ(左上のタイトル)クリック時の遷移先: 未ログインならトップ、ログイン済みならアプリ本体
  (function(){
    var brandLink = document.querySelector("header .brand");
    if (brandLink) brandLink.href = (localStorage.getItem("hs_loggedIn") === "1") ? "./highlight-studio-03-app.html" : "./highlight-studio-01-landing.html";
  })();
</script>
</body>
</html>
